name: Windows CI

on:
  pull_request:
    branches:
      - main
      - feat/launch-prep
      - feat/orders-notifications-accounts-reviews
  push:
    branches:
      - main
      - feat/storefront-foundation
      - feat/launch-prep
      - feat/orders-notifications-accounts-reviews

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-verification:
    name: Windows application verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

  dependency-audit:
    name: Windows full dependency audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full npm audit and fail on any known vulnerability
        shell: pwsh
        run: |
          npm audit --json 1> npm-audit.json 2> npm-audit-stderr.txt
          $auditExitCode = $LASTEXITCODE
          "npm audit exit code: $auditExitCode" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $report = Get-Content npm-audit.json -Raw | ConvertFrom-Json -AsHashtable
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $counts = $report.metadata.vulnerabilities
          "Audit summary: $($counts.total) total ($($counts.critical) critical, $($counts.high) high, $($counts.moderate) moderate, $($counts.low) low)." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($counts.total -ne 0 -or $auditExitCode -ne 0) {
            Write-Error "Known vulnerabilities remain in the complete dependency tree."
            exit 1
          }
          "Full dependency audit is clear: no known npm advisories in production or development dependencies." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit 0

      - name: Upload complete audit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit-exit-code.txt
            npm-audit-stderr.txt
          if-no-files-found: warn
          retention-days: 30

  production-dependency-audit:
    name: Windows production dependency audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependency graph
        shell: pwsh
        run: |
          npm audit --omit=dev --json 1> npm-audit-production.json 2> npm-audit-production-stderr.txt
          $auditExitCode = $LASTEXITCODE
          $report = Get-Content npm-audit-production.json -Raw | ConvertFrom-Json -AsHashtable
          if ($null -eq $report.metadata.vulnerabilities) {
            Write-Error "The production dependency audit did not return a valid vulnerability summary."
            exit 1
          }
          $counts = $report.metadata.vulnerabilities
          "Production dependency audit: $($counts.total) total ($($counts.critical) critical, $($counts.high) high, $($counts.moderate) moderate, $($counts.low) low)." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "npm audit --omit=dev exit code: $auditExitCode" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($counts.total -ne 0 -or $auditExitCode -ne 0) {
            Write-Error "Known vulnerabilities remain in the production dependency graph."
            exit 1
          }

  dependency-fix-dry-run:
    name: Windows npm audit fix dry-run investigation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm

      - name: Install exact committed lockfile
        run: npm ci

      - name: Capture complete npm audit fix dry-run output
        shell: pwsh
        run: |
          npm audit fix --dry-run --json 1> npm-audit-fix-dry-run.json 2> npm-audit-fix-dry-run-stderr.txt
          $dryRunExitCode = $LASTEXITCODE
          Set-Content -Path npm-audit-fix-dry-run-exit-code.txt -Value $dryRunExitCode -NoNewline
          "npm audit fix --dry-run --json exit code: $dryRunExitCode" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path npm-audit-fix-dry-run.json) {
            "Dry-run stdout bytes: $((Get-Item npm-audit-fix-dry-run.json).Length)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          if (Test-Path npm-audit-fix-dry-run-stderr.txt) {
            "Dry-run stderr bytes: $((Get-Item npm-audit-fix-dry-run-stderr.txt).Length)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          # The dry-run exit code is recorded above; its non-zero result is expected
          # while an advisory remains in the committed lockfile. Do not fail this
          # evidence-collection job before its report can be uploaded.
          exit 0

      - name: Capture stable and canary TypeScript-ESLint registry metadata
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path npm-typescript-eslint-metadata | Out-Null
          $packages = @(
            "typescript-eslint",
            "@typescript-eslint/eslint-plugin",
            "@typescript-eslint/parser",
            "@typescript-eslint/project-service",
            "@typescript-eslint/scope-manager",
            "@typescript-eslint/tsconfig-utils",
            "@typescript-eslint/type-utils",
            "@typescript-eslint/types",
            "@typescript-eslint/typescript-estree",
            "@typescript-eslint/utils",
            "@typescript-eslint/visitor-keys"
          )
          foreach ($package in $packages) {
            $safeName = $package.Replace("@", "").Replace("/", "-")
            foreach ($tag in @("latest", "canary")) {
              $output = "npm-typescript-eslint-metadata/$safeName-$tag.json"
              $errorFile = "npm-typescript-eslint-metadata/$safeName-$tag-stderr.txt"
              npm view "$($package)@$tag" version dependencies peerDependencies peerDependenciesMeta engines --json 1> $output 2> $errorFile
              $metadataExitCode = $LASTEXITCODE
              "$package@$tag exit code: $metadataExitCode" | Add-Content -Path npm-typescript-eslint-metadata/index.txt
            }
          }

      - name: Upload full dry-run evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: npm-audit-fix-dry-run
          path: |
            npm-audit-fix-dry-run.json
            npm-audit-fix-dry-run-stderr.txt
            npm-audit-fix-dry-run-exit-code.txt
            npm-typescript-eslint-metadata/
          if-no-files-found: warn
          retention-days: 30

  dependency-remediation-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/launch-prep'
    name: Windows stable TypeScript-ESLint update preview
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm

      - name: Verify or assemble the complete 211-product photo sprite
        shell: pwsh
        run: |
          $assetPath = "public/product-previews/kundu-catalogue-sprite.webp"
          if (Test-Path $assetPath) {
            $bytes = [IO.File]::ReadAllBytes($assetPath)
            "Using the committed catalogue photo sprite." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            $parts = Get-ChildItem "tmp-assets/sprite-parts/part-*.txt" | Sort-Object Name
            if ($parts.Count -ne 13) { throw "Expected 13 sprite data chunks, found $($parts.Count)." }
            $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
            $bytes = [Convert]::FromBase64String($encoded)
            New-Item -ItemType Directory -Force -Path "public/product-previews" | Out-Null
            [IO.File]::WriteAllBytes($assetPath, $bytes)
          }
          if ($bytes.Length -ne 46362) { throw "Unexpected photo sprite size: $($bytes.Length)." }
          if ($bytes[0] -ne 0x52 -or $bytes[1] -ne 0x49 -or $bytes[2] -ne 0x46 -or $bytes[3] -ne 0x46) { throw "The generated asset is not a WebP RIFF file." }
          $spriteHash = (Get-FileHash $assetPath -Algorithm SHA1).Hash.ToLowerInvariant()
          if ($spriteHash -ne "851998ade5b297a527dd3ee1ebb5ab3cf98f8162") { throw "The complete 211-product photo sprite SHA-1 does not match." }
          if (Test-Path "tmp-assets/sprite-parts") { git rm -r -- tmp-assets/sprite-parts }
          "Verified 211 SKU photographs in a $($bytes.Length)-byte WebP sprite (SHA-1 $spriteHash)." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Install the committed dependency tree
        run: npm ci

      - name: Add the stable TypeScript-ESLint security release
        run: npm install --package-lock-only --save-dev --save-exact typescript-eslint@8.73.0

      - name: Install the candidate lockfile from scratch
        run: npm ci

      - name: Capture candidate audit and require only dev-tooling high findings
        shell: pwsh
        run: |
          npm audit --json 1> npm-audit-candidate.json 2> npm-audit-candidate-stderr.txt
          $auditExitCode = $LASTEXITCODE
          "npm audit exit code: $auditExitCode" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $report = Get-Content npm-audit-candidate.json -Raw | ConvertFrom-Json -AsHashtable
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $counts = $report.metadata.vulnerabilities
          "Candidate audit: $($counts.high) high, $($counts.moderate) moderate, $($counts.critical) critical." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($counts.critical -ne 0 -or $counts.moderate -ne 0) {
            Write-Error "The stable update must eliminate the minimatch moderate findings without introducing critical findings."
            exit 1
          }
          foreach ($entry in $report.vulnerabilities.GetEnumerator()) {
            foreach ($node in $entry.Value.nodes) {
              $package = $lock.packages[$node]
              if ($null -eq $package -or $package.dev -ne $true) {
                Write-Error "A remaining audited package is not confirmed as development-only: $node"
                exit 1
              }
            }
          }
          if ($counts.high -gt 0) {
            "High findings remain in development-only tooling; they are recorded, not suppressed." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          # npm audit returns exit code 1 for any finding, including accepted
          # high-only findings that were verified above to be devDependencies.
          # Set success only after the severity and dev-only checks have passed.
          exit 0

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload the tested manifest, lockfile and audit report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: typescript-eslint-8.73-candidate
          path: |
            package.json
            package-lock.json
            npm-audit-candidate.json
            npm-audit-candidate-stderr.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit the verified stable tooling update to the feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/launch-prep'
        shell: pwsh
        run: |
          $changed = git status --porcelain -- package.json package-lock.json public/product-previews/kundu-catalogue-sprite.webp
          if ($changed) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- tmp-assets/sprite-parts package.json package-lock.json
            git add -f -- public/product-previews/kundu-catalogue-sprite.webp
            git commit -m "chore(catalog): publish all 211 product photos"
            git fetch origin "refs/heads/$env:GITHUB_HEAD_REF"
            git rebase FETCH_HEAD
            git push origin "HEAD:refs/heads/$env:GITHUB_HEAD_REF"
          } else {
            "The 211-product photo asset and tested tooling update are already committed." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

