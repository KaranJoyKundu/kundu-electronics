name: Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/storefront-foundation

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-verification:
    name: Windows application verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

  dependency-audit:
    name: Windows dependency audit (reported separately)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run npm audit and preserve its exact exit code
        shell: pwsh
        run: |
          npm audit --json > npm-audit.json
          $auditExitCode = $LASTEXITCODE
          Set-Content -Path npm-audit-exit-code.txt -Value $auditExitCode -NoNewline
          "npm audit exit code: $auditExitCode" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($auditExitCode -ne 0) {
            Write-Host "npm audit reported findings or an audit execution error. The complete JSON report is uploaded separately."
            exit $auditExitCode
          }

      - name: Upload complete audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit-exit-code.txt
          if-no-files-found: warn
          retention-days: 30

  dependency-fix-dry-run:
    name: Windows npm audit fix dry-run investigation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact committed lockfile
        run: npm ci

      - name: Capture complete npm audit fix dry-run output
        shell: pwsh
        run: |
          npm audit fix --dry-run --json 1> npm-audit-fix-dry-run.json 2> npm-audit-fix-dry-run-stderr.txt
          $dryRunExitCode = $LASTEXITCODE
          Set-Content -Path npm-audit-fix-dry-run-exit-code.txt -Value $dryRunExitCode -NoNewline
          "npm audit fix --dry-run --json exit code: $dryRunExitCode" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path npm-audit-fix-dry-run.json) {
            "Dry-run stdout bytes: $((Get-Item npm-audit-fix-dry-run.json).Length)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          if (Test-Path npm-audit-fix-dry-run-stderr.txt) {
            "Dry-run stderr bytes: $((Get-Item npm-audit-fix-dry-run-stderr.txt).Length)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Capture stable and canary TypeScript-ESLint registry metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path npm-typescript-eslint-metadata | Out-Null
          $packages = @(
            "typescript-eslint",
            "@typescript-eslint/eslint-plugin",
            "@typescript-eslint/parser",
            "@typescript-eslint/project-service",
            "@typescript-eslint/scope-manager",
            "@typescript-eslint/tsconfig-utils",
            "@typescript-eslint/type-utils",
            "@typescript-eslint/types",
            "@typescript-eslint/typescript-estree",
            "@typescript-eslint/utils",
            "@typescript-eslint/visitor-keys"
          )
          foreach ($package in $packages) {
            $safeName = $package.Replace("@", "").Replace("/", "-")
            foreach ($tag in @("latest", "canary")) {
              $output = "npm-typescript-eslint-metadata/$safeName-$tag.json"
              $errorFile = "npm-typescript-eslint-metadata/$safeName-$tag-stderr.txt"
              npm view "$($package)@$tag" version dependencies peerDependencies engines --json 1> $output 2> $errorFile
              $metadataExitCode = $LASTEXITCODE
              "$package@$tag exit code: $metadataExitCode" | Add-Content -Path npm-typescript-eslint-metadata/index.txt
            }
          }

      - name: Upload full dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-fix-dry-run
          path: |
            npm-audit-fix-dry-run.json
            npm-audit-fix-dry-run-stderr.txt
            npm-audit-fix-dry-run-exit-code.txt
            npm-typescript-eslint-metadata/
          if-no-files-found: warn
          retention-days: 30
